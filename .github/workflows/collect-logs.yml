name: Collect Tailscale Logs & Send to Wazuh

on:
  schedule:
    # Run every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-logs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      
      - name: Wait for Tailscale to connect
        run: |
          echo "Waiting for Tailscale to be ready..."
          sleep 10
          tailscale status
      
      - name: Collect and Send Logs to Wazuh
        env:
          WAZUH_API_URL: ${{ secrets.WAZUH_API_URL }}
          WAZUH_API_USER: ${{ secrets.WAZUH_API_USER }}
          WAZUH_API_PASSWORD: ${{ secrets.WAZUH_API_PASSWORD }}
          WAZUH_AGENT_ID: ${{ secrets.WAZUH_AGENT_ID }}
        run: python3 scripts/send_to_wazuh.py
      
      - name: Summary
        if: success()
        run: |
          echo "✅ Logs collected and sent to Wazuh successfully"
